<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5EF;
    --ink: #1F2421;
    --ink-muted: #6B6F64;
    --accent: #D6304A;
    --line: #D8D2C4;
    --hole: #F7F5EF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Space Grotesk", sans-serif;
    display: flex;
    justify-content: center;
    padding: 4rem 1.25rem;
  }

  .layout {
    width: 100%;
    max-width: 54rem;
    display: flex;
    gap: 2.5rem;
    align-items: flex-start;
  }

  main {
    width: 100%;
    max-width: 32rem;
    animation: rise 0.4s ease-out;
  }

  .sidebar {
    width: 16rem;
    flex: none;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 1.25rem 1.25rem 1.5rem;
    animation: rise 0.4s ease-out;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .sidebar-header .eyebrow { margin-bottom: 0; }

  .sidebar-header button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    padding: 0.25rem 0.55rem;
  }

  .sidebar-header button:hover { background: var(--ink); color: var(--paper); }

  .session-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    max-height: 32rem;
    overflow-y: auto;
  }

  .session-item {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-radius: 3px;
    padding: 0.5rem 0.6rem;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
  }

  .session-item:hover { background: rgba(31, 36, 33, 0.06); }
  .session-item.active { background: var(--ink); }
  .session-item.active .session-preview,
  .session-item.active .session-time { color: var(--paper); }

  .session-preview {
    font-size: 0.8rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .session-time {
    font-size: 0.65rem;
    color: var(--ink-muted);
    margin-top: 0.15rem;
  }

  .session-empty {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-muted);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }

  .wordmark svg { flex: none; }

  .tagline {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
    color: var(--ink-muted);
    line-height: 1.5;
    margin: 0 0 2.5rem;
  }

  form.tag {
    position: relative;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 1.25rem 1.5rem 1.5rem 2.75rem;
  }

  .tag::before {
    content: "";
    position: absolute;
    top: 1.35rem;
    left: 1.25rem;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--hole);
    border: 1.5px solid var(--ink);
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--ink-muted);
    display: block;
    margin-bottom: 0.6rem;
  }

  .tag-row {
    display: flex;
    gap: 0.6rem;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.95rem;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--line);
    padding: 0.4rem 0.1rem;
  }

  input[type="text"]:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  input[type="text"]::placeholder {
    color: var(--ink-muted);
    opacity: 0.7;
  }

  button {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--paper);
    background: var(--ink);
    border: none;
    padding: 0.5rem 1.1rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:hover:not(:disabled) { background: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: default; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .receipt {
    position: relative;
    margin-top: 2rem;
    padding: 2rem 1.5rem 2.25rem;
    background-color: #FFFDF6;
    background-image:
      linear-gradient(-45deg, var(--paper) 6px, transparent 0),
      linear-gradient(45deg, var(--paper) 6px, transparent 0),
      linear-gradient(135deg, var(--paper) 6px, transparent 0),
      linear-gradient(-135deg, var(--paper) 6px, transparent 0);
    background-position: left bottom, left bottom, left top, left top;
    background-size: 12px 12px;
    background-repeat: repeat-x;
    box-shadow: 0 14px 28px -10px rgba(31, 36, 33, 0.22), 0 3px 8px rgba(31, 36, 33, 0.08);
    display: none;
  }

  .receipt.visible { display: block; }

  .receipt-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.5rem 1rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-muted);
    padding-bottom: 1.1rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px dashed var(--line);
  }

  .meta-label { letter-spacing: 0.08em; margin-right: 0.35rem; }
  .meta-value { color: var(--ink); }

  .entries { display: flex; flex-direction: column; }

  .entry + .entry { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--line); }

  .receipt .eyebrow { color: var(--accent); }
  .receipt .eyebrow:not(:first-child) { margin-top: 0.9rem; display: block; }

  .receipt-body {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.9rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin: 0;
  }

  .receipt-body.error { color: var(--accent); }

  .printing {
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .printing { animation: none; }
  }

  @media (max-width: 48rem) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
    .session-list { max-height: 14rem; }
  }

  @media (max-width: 30rem) {
    body { padding: 2.5rem 1rem; }
    .wordmark { font-size: 1.6rem; }
    .tag-row { flex-direction: column; align-items: stretch; }
    button { width: 100%; }
  }
</style>
</head>
<body>
<div class="layout">
<main>
  <h1 class="wordmark">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20.59 13.41 13.41 20.59a2 2 0 0 1-2.82 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z" fill="#D6304A"/>
      <circle cx="7" cy="7" r="1.6" fill="#F7F5EF"/>
    </svg>
    Pickr
  </h1>
  <p class="tagline">ask about products, reviews, or store policy — get a straight answer.</p>

  <form class="tag" id="query-form">
    <span class="eyebrow">QUERY</span>
    <div class="tag-row">
      <input
        type="text"
        id="query-input"
        placeholder="e.g. is the Alpha Laptop worth it?"
        aria-label="Ask Pickr AI a question"
        autocomplete="off"
        required
      >
      <button type="submit" id="ask-button">Ask</button>
    </div>
  </form>

  <section class="receipt" id="receipt" aria-live="polite">
    <div class="receipt-header">
      <span class="receipt-meta"><span class="meta-label">CONV ID</span><span class="meta-value" id="meta-conv-id"></span></span>
      <span class="receipt-meta"><span class="meta-label">DATE</span><span class="meta-value" id="meta-date"></span></span>
    </div>
    <div class="entries" id="entries"></div>
  </section>
</main>

<aside class="sidebar" aria-label="Conversation history">
  <div class="sidebar-header">
    <span class="eyebrow">SESSIONS</span>
    <button type="button" id="new-session-button" aria-label="Start a new session">New</button>
  </div>
  <ul class="session-list" id="session-list"></ul>
</aside>
</div>

<script>
  const form = document.getElementById("query-form");
  const input = document.getElementById("query-input");
  const button = document.getElementById("ask-button");
  const receipt = document.getElementById("receipt");
  const entries = document.getElementById("entries");
  const sessionList = document.getElementById("session-list");
  const newSessionButton = document.getElementById("new-session-button");
  const metaConvId = document.getElementById("meta-conv-id");
  const metaDate = document.getElementById("meta-date");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Sent with every query so the backend can load/persist this conversation's
  // history. Reassigned when the user opens a past session or starts a new
  // one -- not tied to page load the way it used to be.
  let conversationId = crypto.randomUUID();

  let typewriterTimer = null;

  function addEntry(query, { scroll = true } = {}) {
    receipt.classList.add("visible");

    const entry = document.createElement("div");
    entry.className = "entry";
    entry.innerHTML = `
      <span class="eyebrow">ITEM</span>
      <p class="receipt-body"></p>
      <span class="eyebrow">RESPONSE</span>
      <p class="receipt-body printing">printing…</p>
    `;
    const [itemBody, responseBody] = entry.querySelectorAll("p.receipt-body");
    itemBody.textContent = query;
    entries.appendChild(entry);
    if (scroll) entry.scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth", block: "end" });

    return responseBody;
  }

  function renderHistoryEntries(turns) {
    entries.innerHTML = "";
    for (let i = 0; i < turns.length; i += 2) {
      const userTurn = turns[i];
      const assistantTurn = turns[i + 1];
      if (!userTurn) continue;
      const responseBody = addEntry(userTurn.content, { scroll: false });
      responseBody.classList.remove("printing");
      responseBody.textContent = assistantTurn ? assistantTurn.content : "";
    }
    if (turns.length > 0) receipt.classList.add("visible");
    entries.lastElementChild?.scrollIntoView({ behavior: "auto", block: "end" });
  }

  function setReceiptHeader(id, startedAtIso) {
    metaConvId.textContent = id.slice(0, 8);
    metaDate.textContent = formatTimestamp(startedAtIso || new Date().toISOString());
  }

  function formatTimestamp(isoString) {
    if (!isoString) return "";
    const date = new Date(isoString.endsWith("Z") ? isoString : `${isoString}Z`);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleString(undefined, {
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
    });
  }

  function highlightActiveSession() {
    sessionList.querySelectorAll(".session-item").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.conversationId === conversationId);
    });
  }

  function renderSessions(sessions) {
    sessionList.innerHTML = "";

    if (sessions.length === 0) {
      const empty = document.createElement("li");
      empty.className = "session-empty";
      empty.textContent = "No past sessions yet.";
      sessionList.appendChild(empty);
      return;
    }

    for (const s of sessions) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "session-item";
      btn.dataset.conversationId = s.conversation_id;
      btn.innerHTML = `
        <div class="session-preview"></div>
        <div class="session-time"></div>
      `;
      btn.querySelector(".session-preview").textContent = s.preview || "(no message)";
      btn.querySelector(".session-time").textContent = formatTimestamp(s.last_activity);
      btn.addEventListener("click", () => openSession(s.conversation_id));
      li.appendChild(btn);
      sessionList.appendChild(li);
    }

    highlightActiveSession();
  }

  async function loadSessions() {
    try {
      const res = await fetch("/api/sessions");
      if (!res.ok) return;
      renderSessions(await res.json());
    } catch (err) {
      // sidebar is a convenience; leave it as-is if the fetch fails
    }
  }

  async function openSession(id) {
    conversationId = id;
    input.value = "";
    try {
      const res = await fetch(`/api/sessions/${encodeURIComponent(id)}`);
      const turns = res.ok ? await res.json() : [];
      renderHistoryEntries(turns);
      setReceiptHeader(id, turns[0]?.created_at);
    } catch (err) {
      renderHistoryEntries([]);
      setReceiptHeader(id);
    }
    highlightActiveSession();
    input.focus();
  }

  newSessionButton.addEventListener("click", () => {
    conversationId = crypto.randomUUID();
    entries.innerHTML = "";
    receipt.classList.remove("visible");
    setReceiptHeader(conversationId);
    highlightActiveSession();
    input.focus();
  });

  function typeOut(responseBody, text) {
    responseBody.classList.remove("printing");
    clearInterval(typewriterTimer);

    if (reducedMotion) {
      responseBody.textContent = text;
      return;
    }

    responseBody.textContent = "";
    let i = 0;
    typewriterTimer = setInterval(() => {
      responseBody.textContent += text[i];
      i += 1;
      if (i >= text.length) clearInterval(typewriterTimer);
    }, 12);
  }

  function showError(responseBody, message) {
    responseBody.classList.remove("printing");
    responseBody.classList.add("error");
    responseBody.textContent = message;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    input.value = "";
    button.disabled = true;
    const responseBody = addEntry(query);

    try {
      const res = await fetch("/api/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, conversation_id: conversationId }),
      });

      if (!res.ok) {
        const detail = await res.json().catch(() => null);
        throw new Error(detail && detail.detail ? detail.detail : `Request failed (${res.status})`);
      }

      const data = await res.json();
      typeOut(responseBody, data.response ?? "No response returned.");
      loadSessions();
    } catch (err) {
      showError(responseBody, `Couldn't print a response — ${err.message}. Try asking again.`);
    } finally {
      button.disabled = false;
    }
  });

  setReceiptHeader(conversationId);
  loadSessions();
</script>
</body>
</html>
